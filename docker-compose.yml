services:
  web:
    build: .
    container_name: story-web
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /volume3/media/links/电视剧/儿童/儿童绘本:/data/downloads
      - ./config:/app/config
    environment:
      - DOWNLOAD_BASE_PATH=/data/downloads
      - REDIS_URL=redis://127.0.0.1:6379/0
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - QSY_PARSE_API_URL=${QSY_PARSE_API_URL:-https://a.jiejing.fun/parse}
      - QSY_PARSE_KEY=${QSY_PARSE_KEY:-}
      - QSY_PARSE_TYPE=${QSY_PARSE_TYPE:-sd}
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - AUTH_KEY=${AUTH_KEY:?Set AUTH_KEY in the deployment environment}
